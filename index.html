<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Visualizador do Acervo ÉPURA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --papel: #f3f1ec; --painel: #fbfaf7; --branco: #ffffff;
    --tinta: #2b2a27; --tinta-2: #5c574e; --linha: #d8d2c6; --linha-forte: #b9b2a4;
    /* estados: a cor só reforça; o texto sempre diz o estado (R8) */
    --site: #4f9e98; --site-texto: #2c6b66; --site-fundo: #e3f0ec;
    --grupo: #8f877a; --grupo-fundo: #ebe7df;
    --fora: #a3324f; --fora-fundo: #f6e3e7;
    --aberto: #e4dfd5;
    --falta: #b0412f; --falta-fundo: #fbe9e4;
    --lente: #2c6b66;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--papel); color: var(--tinta); font: 16px/1.5 Inter, system-ui, sans-serif; }
  .pagina { max-width: 980px; margin: 0 auto; padding: 20px 16px 120px; }
  h1 { font-size: 22px; line-height: 1.25; margin: 0 0 4px; font-weight: 600; }
  h2 { font-size: 20px; line-height: 1.3; margin: 0 0 4px; font-weight: 600; }
  h3 { font-size: 17px; line-height: 1.35; margin: 0; font-weight: 600; overflow-wrap: anywhere; }
  .rotulo { font-size: 14px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-2); margin: 28px 0 8px; }
  .sec { font-size: 14px; color: var(--tinta-2); }
  p { margin: 0 0 8px; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .bt { min-height: 44px; min-width: 44px; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--linha-forte);
        background: var(--branco); display: inline-flex; align-items: center; gap: 8px; text-align: left; }
  .bt:hover { border-color: var(--tinta); }
  .bt:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--tinta); outline-offset: 2px; }
  .bt.escuro { background: var(--tinta); border-color: var(--tinta); color: #fff; }
  .bt.texto { border-color: transparent; background: transparent; text-decoration: underline; padding: 10px 8px; }
  a.bt { color: var(--tinta); text-decoration: none; }
  .linha-bts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }

  /* carregamento (R10) */
  .esqueleto { padding: 40px 16px; max-width: 980px; margin: 0 auto; }
  .esqueleto .barra { height: 18px; border-radius: 6px; background: #e6e1d7; margin: 12px 0; }

  /* topo e progresso */
  header { border-bottom: 1px solid var(--linha); padding-bottom: 16px; margin-bottom: 8px; }
  .progresso { background: var(--painel); border: 1px solid var(--linha); border-radius: 10px; padding: 14px 16px; margin-top: 16px; }
  .progresso .numeros { font-size: 17px; font-weight: 500; }
  .pilha { display: flex; height: 16px; border-radius: 4px; overflow: hidden; margin: 12px 0 10px; background: var(--aberto); border: 1px solid var(--linha); }
  .pilha span { display: block; height: 100%; }
  .legenda { display: flex; flex-wrap: wrap; gap: 6px 18px; }
  .legenda span { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; color: var(--tinta-2); }
  .amostra-cor { width: 14px; height: 14px; border-radius: 3px; flex: none; border: 1px solid rgba(0,0,0,.15); }

  /* busca e lentes */
  .ferramentas { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 16px; }
  .campo { display: grid; gap: 4px; }
  .campo label { font-size: 14px; color: var(--tinta-2); }
  .campo input, .campo select { min-height: 44px; padding: 8px 12px; border: 1px solid var(--linha-forte); border-radius: 8px; background: var(--branco); width: 100%; }
  .lentes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .resultados { display: grid; gap: 6px; margin-top: 8px; }
  .resultados .bt { width: 100%; justify-content: flex-start; flex-wrap: wrap; }
  .aviso-lente { font-size: 14px; color: var(--lente); margin-top: 8px; }

  /* árvore recuada (Lattes) */
  ul.arvore { list-style: none; margin: 0; padding: 0; }
  ul.arvore ul { list-style: none; margin: 0 0 0 21px; padding: 0 0 0 12px; border-left: 1px solid var(--linha-forte); }
  .no { display: grid; grid-template-columns: 44px 1fr; align-items: start; gap: 4px; padding: 2px 0; }
  .no .abrir { width: 44px; height: 44px; border: 0; background: transparent; border-radius: 8px; font-size: 16px; color: var(--tinta-2); }
  .no .abrir:hover { background: var(--aberto); }
  .no .sem-filhos { width: 44px; height: 44px; }
  .no .corpo { min-height: 44px; padding: 8px 10px; border-radius: 8px; border: 1px solid transparent; background: transparent;
               text-align: left; width: 100%; display: grid; gap: 2px; }
  .no .corpo:hover { background: var(--painel); border-color: var(--linha); }
  .no .titulo { font-weight: 500; overflow-wrap: anywhere; }
  .no .meta { font-size: 14px; color: var(--tinta-2); display: flex; flex-wrap: wrap; gap: 2px 12px; }
  .no.fora-lente .titulo { color: var(--tinta-2); font-weight: 400; }
  .no.na-lente .corpo { border-color: var(--lente); background: var(--site-fundo); }
  .ver-todos { margin: 4px 0 8px 48px; }
  .estado { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
  .estado .amostra-cor { width: 12px; height: 12px; }
  .tag-falta { font-size: 14px; color: var(--falta); font-weight: 500; }
  .em-aberto { margin-top: 12px; border-top: 1px dashed var(--linha-forte); padding-top: 8px; }

  /* material que falta */
  .faltas { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .faltas .bt { flex-direction: column; align-items: flex-start; gap: 0; }
  .faltas .bt b { font-size: 20px; font-weight: 600; }
  .faltas .bt.ativo { border-color: var(--tinta); box-shadow: inset 0 0 0 1px var(--tinta); }
  .lista-pedidos { display: grid; gap: 8px; margin-top: 10px; }

  /* tela do assunto */
  .caminho-galho { font-size: 14px; color: var(--tinta-2); margin: 8px 0 12px; overflow-wrap: anywhere; }
  .decisao-grande { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .decisao-grande .bt { flex-direction: column; align-items: flex-start; min-height: 64px; gap: 2px; }
  .decisao-grande .bt small, .botoes-pasta .bt small { font-size: 14px; color: var(--tinta-2); }
  .bt.ativo[data-v="liberado"] { border-color: var(--site); background: var(--site-fundo); box-shadow: inset 0 0 0 1px var(--site); }
  .bt.ativo[data-v="interno"] { border-color: var(--grupo); background: var(--grupo-fundo); box-shadow: inset 0 0 0 1px var(--grupo); }
  .bt.ativo[data-v="nao_incorporar"] { border-color: var(--fora); background: var(--fora-fundo); box-shadow: inset 0 0 0 1px var(--fora); }
  .cartao { background: var(--painel); border: 1px solid var(--linha); border-radius: 10px; padding: 14px 16px; margin-top: 10px; }
  .cartao.foco { border-color: var(--tinta); box-shadow: inset 0 0 0 1px var(--tinta); }
  .cartao .onde { font-size: 14px; color: var(--tinta-2); overflow-wrap: anywhere; }
  .cartao .amostra { font-size: 14px; color: var(--tinta-2); overflow-wrap: anywhere; margin-top: 4px; }
  .pessoais { border-left: 4px solid var(--falta); background: var(--falta-fundo); padding: 8px 12px; margin-top: 8px; font-size: 14px; }
  .botoes-pasta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .acoes { border-top: 1px solid var(--linha); margin-top: 12px; padding-top: 4px; gap: 0 4px; }
  .bt.leve { border-color: transparent; background: transparent; text-decoration: underline; text-underline-offset: 3px; padding: 10px 8px; }
  .bt.leve:hover { background: var(--aberto); }
  .segue { font-size: 14px; margin-top: 8px; }
  .pedido .bts-pedido { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .pedido .bt.ativo { border-color: var(--tinta); background: var(--aberto); box-shadow: inset 0 0 0 1px var(--tinta); }
  .ligar { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--linha); }

  /* barra de retorno (R9) */
  /* faixa opaca de largura inteira no rodapé: cobre o conteúdo, não fica por cima de texto solto */
  .barra-salvo { position: fixed; left: 0; right: 0; bottom: 0; background: var(--tinta); color: #fff;
                 padding: 8px max(16px, calc((100% - 980px) / 2 + 16px)); display: none; align-items: center;
                 justify-content: space-between; gap: 12px; z-index: 10; box-shadow: 0 -2px 8px rgba(0,0,0,.15); }
  .barra-salvo .bt { background: transparent; border-color: #fff; color: #fff; }
  .barra-salvo.erro { background: var(--fora); }
  footer { margin-top: 40px; font-size: 14px; color: var(--tinta-2); }

  @media (min-width: 700px) {
    .pagina { padding: 28px 24px 120px; }
    .ferramentas { grid-template-columns: 1.3fr 1fr; align-items: end; }
    h1 { font-size: 26px; }
  }
  @media (max-width: 600px) {
    ul.arvore ul { margin-left: 12px; padding-left: 6px; }
    .no { grid-template-columns: 44px 1fr; gap: 0; }
    .decisao-grande { grid-template-columns: 1fr; }
    .lentes { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="carregando" class="esqueleto" aria-live="polite">
  <p id="etapa">Carregando o acervo…</p>
  <div class="barra" style="width:70%"></div><div class="barra" style="width:45%"></div><div class="barra" style="width:60%"></div>
</div>
<div id="app" class="pagina" hidden></div>
<div id="barra" class="barra-salvo" role="status" aria-live="polite"><span id="barra-texto"></span><button id="desfazer" class="bt" type="button">Desfazer</button></div>

<script>
// ---------- vocabulário da tela (R4: só palavras dela) ----------
const ROTULO = { liberado: 'Pode ir para o site', interno: 'Só para o grupo', nao_incorporar: 'Deixado de fora' };
const BOTAO = { liberado: 'Pode ir para o site', interno: 'Só para o grupo', nao_incorporar: 'Deixar de fora' };
const EXPLICA = { liberado: 'aparece no site do grupo', interno: 'fica só no acervo do grupo', nao_incorporar: 'some do acervo; continua no Drive' };
const COR = { liberado: 'var(--site)', interno: 'var(--grupo)', nao_incorporar: 'var(--fora)', aberto: 'var(--aberto)' };
const PEDIDO = { a_pedir: 'Falta o arquivo', pedido: 'Já pedimos', recebido: 'Recebido', nao_existe: 'Não existe mais', conferir: 'Conferir' };
const PESO = { nao_incorporar: 3, interno: 2, liberado: 1 };
const LINHAS = { EL: 'Espaços livres', PT: 'Políticas territoriais em Mato Grosso', PU: 'Paisagem urbana', UM: 'Urbanização e urbanismo em Mato Grosso' };
const GALHOS = ['galho', 'programa', 'quadrante'];
const RAIZ = 'grupo-epura', EM_ABERTO = 'ramo-em-aberto', MAX = 7;
// pedidos cujo id não é "ped-" + assunto
const PEDIDO_ASSUNTO = { 'ped-proj-transformacoes-mt': 'proj-amazonicidades', 'ped-proj-centro-historico': 'proj-centro-historico-gestao',
  'ped-proj-amigos-cidade': 'proj-amigos-da-cidade', 'ped-proj-defesa-cidades': 'proj-defesa-das-cidades',
  'ped-proj-oficina-luos': 'acao-oficina-luos', 'ped-proj-transver': 'proj-enepea-2022', 'ped-proj-parques-brasil': 'proj-parques-urbanos',
  'ped-premio-rosa-kliass-santos': 'evento-premio-rosa-kliass', 'ped-dropbox-tfg-epura': 'orient-tfg',
  'ped-cadastro-amanda-2026': 'tfg-2026-mendes', 'ped-cadastro-yohanna-2026': 'tfg-2026-berti',
  'ped-cadastro-renata-2024': 'tfg-2024-rodrigues-oliveira' };

// ---------- servidor ----------
const API = 'https://script.google.com/macros/s/AKfycbzFppJZh4JO-VMg4hkqiYCqijiD-oVPXUzzqiEEsyJEYa7A-gW_n848MmPKzBtrNERi/exec';
const chave = new URLSearchParams(location.search).get('k') || '';
function chamar(metodo, corpo) {
  const op = { method: metodo, credentials: 'omit', redirect: 'follow' };
  let url = API;
  if (metodo === 'GET') url += '?' + new URLSearchParams(corpo);
  else { op.headers = { 'Content-Type': 'text/plain;charset=utf-8' }; op.body = JSON.stringify(corpo); }
  return fetch(url, op).then(r => { if (!r.ok) throw new Error('o servidor respondeu ' + r.status); return r.json(); })
    .then(d => { if (d && d.erro) throw new Error(d.erro); return d; });
}

// ---------- utilidades ----------
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = n => Number(n || 0).toLocaleString('pt-BR');
const plural = (n, um, varios) => num(n) + ' ' + (n === 1 ? um : varios);
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const lista = s => String(s || '').split(';').map(x => x.trim()).filter(Boolean);
// "2023-" → "desde 2023"; "2024-2025" → "2024–2025"; "2021; 2023" → "2021, 2023"
const anosLegiveis = s => String(s || '').trim().replace(/^(\d{4})\s*-$/, 'desde $1').replace(/(\d{4})\s*-\s*(\d{4})/g, '$1–$2').replace(/\s*;\s*/g, ', ');
// texto vindo da planilha que pode ter caminho cru (R5): caminho vira "a › b", "_" vira espaço
function textoLegivel(s) {
  return String(s || '')
    .replace(/Meu computador/gi, 'Computador do grupo').replace(/Compartilhados/gi, 'Compartilhado com o grupo')
    .replace(/Meu Drive/gi, 'Drive do grupo').replace(/\b[A-Z]:\\/g, 'PC do grupo › ')
    .replace(/\s*[\\/]+\s*/g, ' › ').replace(/_+/g, ' ').replace(/\s+/g, ' ').trim();
}

// ---------- estado ----------
let D = null, quem = '';
const A = {}, P = {}, filhosP = {}, pedidos = [], decA = {};
let lente = { linha: '', pessoa: '' }, abertos = new Set(), todos = new Set(), filtroFalta = '', ultimaBusca = '';

function montar(d) {
  D = d; quem = d.quem || '';
  // assuntos
  const ca = n => d.assuntos.cab.indexOf(n);
  d.assuntos.linhas.forEach(r => {
    const a = { id: r[ca('assunto_id')], pai: r[ca('pai')], tipo: r[ca('tipo')], titulo: r[ca('titulo')], anos: anosLegiveis(r[ca('anos')]),
      coord: r[ca('coordenacao')], pessoas: r[ca('pessoas')], linhas: lista(r[ca('linhas')]), estado: r[ca('estado')],
      ordem: +r[ca('ordem')] || 0, filhos: [], raizes: [], ef: new Set(), tambem: [], pedidos: [] };
    A[a.id] = a;
  });
  Object.values(A).forEach(a => { if (A[a.pai]) A[a.pai].filhos.push(a); });
  Object.values(A).forEach(a => a.filhos.sort((x, y) => x.ordem - y.ordem));
  // pastas
  const c = n => d.cab.indexOf(n);
  d.linhas.forEach(r => {
    const p = { id: r[c('pasta_id')], pai: r[c('pai')], arquivos: +r[c('arquivos')] || 0, proprios: +r[c('arquivos_proprios')] || 0,
      sens: +r[c('sensiveis')] || 0, link: r[c('link')], nome: r[c('nome_legivel')] || 'Pasta sem nome', onde: r[c('onde_legivel')],
      resumo: r[c('resumo_conteudo')], amostra: r[c('amostra')], own: lista(r[c('assuntos_da_pasta')]), ef: new Set(lista(r[c('assuntos')])),
      tambem: lista(r[c('tambem_em')]), decisao: r[c('decisao')] || '', apagar: r[c('apagar')] || '' };
    P[p.id] = p;
  });
  Object.values(P).forEach(p => { if (P[p.pai]) (filhosP[p.pai] = filhosP[p.pai] || []).push(p.id); });
  // vínculos manuais ainda não refletidos na aba (gravados hoje pela página)
  (d.vinculos_manuais || []).forEach(([pid, as, papel]) => aplicarVinculo(pid, as, papel, true));
  Object.assign(decA, d.decisoes_assunto || {});
  // pedidos
  const cp = n => d.pedidos.cab.indexOf(n);
  d.pedidos.linhas.forEach(r => {
    const id = r[cp('pedido_id')], alvo = PEDIDO_ASSUNTO[id] || id.replace(/^ped-/, '');
    const pe = { id, assunto: A[alvo] ? alvo : '', titulo: r[cp('assunto')], ano: r[cp('ano')], autor: r[cp('autor')],
      falta: r[cp('o_que_falta')], quem: r[cp('a_quem_pedir')], estado: r[cp('estado')] || 'a_pedir',
      evid: r[cp('evidencia')], obs: r[cp('observacao')] };
    pedidos.push(pe);
    if (pe.assunto) A[pe.assunto].pedidos.push(pe);
  });
  indexar();
}

function descendentesP(id, fn) { const pilha = [id]; while (pilha.length) { const k = pilha.pop(); fn(k); (filhosP[k] || []).forEach(f => pilha.push(f)); } }
function aplicarVinculo(pid, as, papel, inicial) {
  const p = P[pid]; if (!p || !A[as]) return;
  if (papel === 'fora') { descendentesP(pid, k => P[k].ef.delete(as)); return; }
  if (papel !== 'material') { if (!p.tambem.includes(as)) p.tambem.push(as); return; }
  if (!p.own.includes(as)) p.own.push(as);
  descendentesP(pid, k => P[k].ef.add(as));
  if (!inicial) indexar();
}
function tirarVinculo(pid, as) {
  const p = P[pid]; if (!p) return;
  p.own = p.own.filter(x => x !== as);
  // tira da pasta e das de baixo, a menos que uma pasta acima ou abaixo ainda tenha o assunto como próprio
  const acima = q => { for (let x = P[q.pai]; x; x = P[x.pai]) if (x.own.includes(as)) return true; return false; };
  if (!acima(p)) descendentesP(pid, k => { if (!P[k].own.includes(as) || k === pid) P[k].ef.delete(as); });
  indexar();
}

// índices assunto → pastas
function indexar() {
  Object.values(A).forEach(a => { a.raizes = []; a.ef = new Set(); a.tambemP = []; });
  Object.values(P).forEach(p => {
    p.own.forEach(as => A[as] && A[as].raizes.push(p.id));
    p.ef.forEach(as => A[as] && A[as].ef.add(p.id));
    p.tambem.forEach(as => A[as] && A[as].tambemP.push(p.id));
  });
  // totais por galho: cada pasta contada uma vez
  const total = a => { const s = new Set(a.ef); a.filhos.forEach(f => total(f).forEach(x => s.add(x))); a.efTotal = s; return s; };
  if (A[RAIZ]) total(A[RAIZ]);
}
const arquivosDe = conj => { let s = 0; conj.forEach(id => s += P[id].proprios); return s; };

// ---------- decisão efetiva (mesma regra do Revisao.gs) ----------
function decisaoPasta(p) {
  for (let q = p; q; q = P[q.pai]) {
    if (q.decisao) return { v: q.decisao, de: 'pasta', pasta: q };
    let melhor = null;
    q.own.forEach(as => {
      const d = decA[as];
      if (d && p.ef.has(as) && (!melhor || PESO[d] > PESO[melhor.v])) melhor = { v: d, de: 'assunto', assunto: A[as] };
    });
    if (melhor) return melhor;
  }
  return { v: 'interno', de: 'padrao' };
}
function estadoAssunto(a) {
  const pastas = [...a.ef];
  const excecoes = pastas.filter(id => { const d = decisaoPasta(P[id]); return d.de === 'pasta'; }).length;
  if (decA[a.id]) return { v: decA[a.id], texto: ROTULO[decA[a.id]] + (excecoes ? ', com exceções' : ''), revisado: true };
  if (pastas.length && pastas.every(id => decisaoPasta(P[id]).de !== 'padrao')) return { v: 'misto', texto: 'Decidido pelas pastas', revisado: true };
  if (excecoes) return { v: 'aberto', texto: 'Revisado em parte', revisado: false };
  return { v: 'aberto', texto: 'Ainda não revisado', revisado: false };
}
function tituloDe(a) {
  if (a.tipo === 'tfg') return 'TFG de ' + (lista(a.pessoas)[0] || '?') + (a.anos ? ' (' + a.anos + ')' : '');
  return a.titulo;
}
function sobDe(a) { return a.tipo === 'tfg' ? a.titulo : ''; }
function dentroDe(a, raizId) { for (let x = a; x; x = A[x.pai]) if (x.id === raizId) return true; return false; }
function caminhoGalho(a) { const out = []; for (let x = A[a.pai]; x && x.id !== RAIZ; x = A[x.pai]) out.unshift(tituloDe(x)); return out; }
const pedidosAbertos = a => a.pedidos.filter(p => p.estado === 'a_pedir' || p.estado === 'pedido' || p.estado === 'conferir');

// ---------- lentes ----------
function naLente(a) {
  if (!lente.linha && !lente.pessoa) return null;
  let ok = true;
  if (lente.linha) ok = ok && a.linhas.includes(lente.linha);
  if (lente.pessoa) {
    const toks = norm(lente.pessoa).split(' ').filter(t => t.length > 2);
    const alvo = norm((a.pessoas || '') + ' ' + (a.coord || ''));
    ok = ok && toks.length > 0 && toks.every(t => alvo.includes(t));
  }
  return ok;
}
function temNaLente(a) { return naLente(a) || a.filhos.some(temNaLente); }
function pessoasTodas() {
  const s = new Set();
  Object.values(A).forEach(a => lista(a.pessoas).concat(lista(a.coord)).forEach(n => s.add(n.replace(/\s*\(.*?\)\s*/g, ' ').trim())));
  return [...s].filter(Boolean).sort((x, y) => x.localeCompare(y, 'pt-BR'));
}

// ---------- Tela 1 ----------
function progresso() {
  const soma = { liberado: 0, interno: 0, nao_incorporar: 0, aberto: 0 };
  let total = 0;
  Object.values(P).forEach(p => {
    if (!p.proprios) return;
    const d = decisaoPasta(p);
    soma[d.de === 'padrao' ? 'aberto' : d.v] += p.proprios; total += p.proprios;
  });
  const comMaterial = Object.values(A).filter(a => a.raizes.length && !dentroDe(a, EM_ABERTO));
  const revisados = comMaterial.filter(a => estadoAssunto(a).revisado).length;
  const folhas = Object.values(A).filter(a => !GALHOS.includes(a.tipo) && !dentroDe(a, EM_ABERTO));
  const comArquivo = folhas.filter(a => a.ef.size).length;
  const revistos = total - soma.aberto;
  const pct = k => total ? (100 * soma[k] / total) : 0;
  return `<section class="progresso" aria-label="Quanto já foi revisado">
    <p class="numeros">Você revisou ${num(revisados)} de ${num(comMaterial.length)} assuntos · ${num(revistos)} de ${num(total)} arquivos</p>
    <p class="sec">${num(comArquivo)} de ${num(folhas.length)} assuntos têm arquivo no Drive do grupo.</p>
    <div class="pilha" role="img" aria-label="Arquivos por decisão">
      ${['liberado', 'interno', 'nao_incorporar'].map(k => `<span style="width:${pct(k)}%;background:${COR[k]}"></span>`).join('')}
    </div>
    <div class="legenda">
      ${['liberado', 'interno', 'nao_incorporar'].map(k => `<span><i class="amostra-cor" style="background:${COR[k]}"></i>${ROTULO[k]}: ${num(soma[k])}</span>`).join('')}
      <span><i class="amostra-cor" style="background:${COR.aberto}"></i>Ainda não revisado: ${num(soma.aberto)}</span>
    </div>
  </section>`;
}

function linhaArvore(a, nivel) {
  const temFilhos = a.filhos.length > 0, aberto = abertos.has(a.id);
  const est = estadoAssunto(a), arq = arquivosDe(a.efTotal || a.ef), lt = naLente(a);
  const classe = lt === null ? '' : lt ? ' na-lente' : ' fora-lente';
  const faltam = pedidosAbertos(a).length;
  const meta = [a.anos, a.tipo === 'tfg' ? '' : a.coord].filter(Boolean).join(' · ');
  const mostraEstado = !GALHOS.includes(a.tipo) || a.raizes.length;
  let h = `<li><div class="no${classe}">
    ${temFilhos ? `<button class="abrir" type="button" data-abrir="${esc(a.id)}" aria-expanded="${aberto}" aria-label="${aberto ? 'Fechar' : 'Abrir'} ${esc(tituloDe(a))}">${aberto ? '▾' : '▸'}</button>` : '<span class="sem-filhos"></span>'}
    <button class="corpo" type="button" data-assunto="${esc(a.id)}">
      <span class="titulo">${esc(tituloDe(a))}</span>
      ${sobDe(a) ? `<span class="sec">${esc(sobDe(a))}</span>` : ''}
      <span class="meta">${meta ? `<span>${esc(meta)}</span>` : ''}<span>${arq ? plural(arq, 'arquivo', 'arquivos') : 'Sem arquivo no Drive do grupo'}</span>
        ${mostraEstado && arq ? `<span class="estado"><i class="amostra-cor" style="background:${COR[est.v] || COR.aberto}"></i>${esc(est.texto)}</span>` : ''}
        ${faltam ? `<span class="tag-falta">Falta o arquivo</span>` : ''}
        ${temFilhos ? `<span>${plural(a.filhos.length, 'item', 'itens')}</span>` : ''}</span>
    </button></div>`;
  if (temFilhos && aberto) h += listaNivel(a, nivel + 1);
  return h + '</li>';
}
function listaNivel(a, nivel, filhos) {
  filhos = filhos || a.filhos;
  let vis = filhos, extraLente = false;
  if (filhos.length > MAX && !todos.has(a.id)) {
    vis = filhos.slice(0, MAX);
    // com lente, o que está na lente aparece mesmo depois do sétimo
    filhos.slice(MAX).forEach(f => { if (temNaLente(f) && lente.linha + lente.pessoa) { vis.push(f); extraLente = true; } });
  }
  const marcas = (todos.has(a.id) ? ' data-expandido' : '') + (extraLente ? ' data-lente' : '');
  let h = `<ul class="${nivel === 0 ? 'arvore' : ''}" data-nivel="${esc(a.id)}"${marcas}>` + vis.map(f => linhaArvore(f, nivel)).join('') + '</ul>';
  if (vis.length < filhos.length) h += `<div class="ver-todos"><button class="bt texto" type="button" data-todos="${esc(a.id)}">Ver todos (${num(filhos.length)})</button></div>`;
  return h;
}

function blocoFaltas() {
  const cont = {}; Object.keys(PEDIDO).forEach(k => cont[k] = 0);
  pedidos.forEach(p => cont[p.estado] = (cont[p.estado] || 0) + 1);
  let h = `<h2 class="rotulo" id="faltas">Material que falta</h2><p class="sec">Trabalhos e projetos sem arquivo encontrado no Drive do grupo nem no PC do grupo. Escolha um estado para ver a lista.</p>
    <div class="faltas">${Object.keys(PEDIDO).map(k => `<button class="bt${filtroFalta === k ? ' ativo' : ''}" type="button" data-falta="${k}" aria-pressed="${filtroFalta === k}"><b>${num(cont[k])}</b>${PEDIDO[k]}</button>`).join('')}</div>`;
  if (filtroFalta) {
    const l = pedidos.filter(p => p.estado === filtroFalta);
    h += `<div class="lista-pedidos">${l.length ? l.map(p => `<button class="bt" type="button" ${p.assunto ? `data-assunto="${esc(p.assunto)}"` : 'disabled'} style="width:100%;flex-direction:column;align-items:flex-start;gap:0">
      <span>${esc(p.assunto ? tituloDe(A[p.assunto]) : textoLegivel(p.titulo))}</span><span class="sec">${esc(textoLegivel(p.falta))}${p.quem ? ' · pedir a ' + esc(textoLegivel(p.quem)) : ''}</span></button>`).join('') : '<p class="sec">Nenhum.</p>'}</div>`;
  }
  return h;
}

function telaInicio() {
  const raiz = A[RAIZ];
  if (!raiz) return '<p>A aba de assuntos está vazia. Avise Arthur.</p>';
  const galhos = raiz.filhos.filter(f => f.id !== EM_ABERTO);
  const linhaOpts = Object.keys(LINHAS).map(k => `<option value="${k}"${lente.linha === k ? ' selected' : ''}>${LINHAS[k]}</option>`).join('');
  const nLente = (lente.linha || lente.pessoa) ? Object.values(A).filter(a => naLente(a)).length : 0;
  return `<header>
      <h1>Visualizador do Acervo ÉPURA</h1>
      <p>Decida o que do Drive do grupo pode aparecer no site. Nada é apagado.</p>

    </header>
    <div class="ferramentas">
      <div class="campo"><label for="busca">Procurar pessoa, projeto, ano ou pasta</label>

      <div class="lentes">
        <div class="campo"><label for="lente-linha">Linha de pesquisa</label>
          <select id="lente-linha"><option value="">Todas</option>${linhaOpts}</select></div>
        <div class="campo"><label for="lente-pessoa">Pessoa</label>
          <input id="lente-pessoa" list="pessoas" autocomplete="off" value="${esc(lente.pessoa)}" placeholder="Nome">
          <datalist id="pessoas">${pessoasTodas().map(n => `<option value="${esc(n)}">`).join('')}</datalist></div>
      </div>
    </div>
    <div id="resultados" class="resultados" aria-live="polite"></div>
    ${lente.linha || lente.pessoa ? `<p class="aviso-lente">${nLente ? (nLente === 1 ? '1 assunto ligado à escolha aparece destacado.' : num(nLente) + ' assuntos ligados à escolha aparecem destacados.') : 'Nenhum assunto ligado a essa escolha.'}
      <button class="bt texto" type="button" id="limpar-lente">Tirar a escolha</button></p>` : ''}
    <h2 class="rotulo">Produção do grupo</h2>

    <footer id="rodape">${quem ? 'Suas decisões ficam registradas com o nome ' + esc(quem) + '. ' : ''}<span id="tempo"></span></footer>`;
}

function buscar(q) {
  ultimaBusca = q;
  const el = document.getElementById('resultados');
  const n = norm(q.trim());
  if (n.length < 2) { el.innerHTML = ''; return; }
  const as = Object.values(A).filter(a => a.id !== RAIZ && norm([tituloDe(a), a.titulo, a.pessoas, a.coord, a.anos].join(' ')).includes(n)).slice(0, MAX);
  const ps = Object.values(P).filter(p => norm(p.nome).includes(n)).sort((x, y) => y.arquivos - x.arquivos).slice(0, MAX);
  el.innerHTML = (as.length || ps.length ? '' : '<p class="sec">Nada encontrado.</p>') +
    as.map(a => `<button class="bt" type="button" data-assunto="${esc(a.id)}"><span>${esc(tituloDe(a))}</span><span class="sec">${esc([a.anos, caminhoGalho(a).slice(-1)[0]].filter(Boolean).join(' · '))}</span></button>`).join('') +
    ps.map(p => `<button class="bt" type="button" data-pasta="${esc(p.id)}"><span>Pasta ${esc(p.nome)}</span><span class="sec">${esc(p.onde || 'Drive do grupo')} · ${plural(p.arquivos, 'arquivo', 'arquivos')}</span></button>`).join('');
}

// ---------- Tela 2 ----------
function botoesDecisao(atual, classe) {
  return ['liberado', 'interno', 'nao_incorporar'].map(v => `<button class="bt${atual === v ? ' ativo' : ''}" type="button" data-v="${v}" aria-pressed="${atual === v}">
    <span>${BOTAO[v]}</span>${classe === 'grande' ? `<small>${EXPLICA[v]}</small>` : ''}</button>`).join('');
}
function cartaoPasta(p, a, foco) {
  const d = decisaoPasta(p);
  const segue = d.de === 'pasta' && d.pasta === p ? 'Decisão desta pasta: ' + ROTULO[d.v] + '.'
    : d.de === 'pasta' ? `Esta pasta segue a decisão de ${esc(d.pasta.nome)}: ${ROTULO[d.v]}.`
    : d.de === 'assunto' ? `Esta pasta segue a decisão de ${esc(tituloDe(d.assunto))}: ${ROTULO[d.v]}.`
    : 'Ainda não revisada. Enquanto isso, fica só para o grupo.';
  const outros = [...new Set(p.own.concat(p.tambem))].filter(x => x !== a.id && A[x]);
  const sub = p.arquivos - p.proprios;
  return `<article class="cartao${foco ? ' foco' : ''}" data-cartao="${esc(p.id)}" id="pasta-${esc(p.id)}">
    <h3>${esc(p.nome)}</h3>
    ${p.onde ? `<div class="onde">Em ${esc(p.onde)}</div>` : ''}
    <p class="sec" style="margin-top:4px">${esc(p.resumo || '')}${sub > 0 ? ` (${plural(sub, 'arquivo está', 'arquivos estão')} em pastas dentro desta)` : ''}</p>
    ${p.amostra ? `<div class="amostra">Alguns arquivos: ${esc(p.amostra)}</div>` : ''}

    <p class="segue">${segue}</p>

      ${p.decisao ? `<button class="bt texto" type="button" data-limpar-pasta="${esc(p.id)}">Seguir o assunto</button>` : ''}</div>
    <div class="linha-bts acoes">
      <button class="bt leve" type="button" data-apagar="${esc(p.id)}" aria-pressed="${p.apagar === 'sim'}">${p.apagar === 'sim' ? 'Sugestão de apagar marcada (tirar)' : 'Sugerir apagar do Drive'}</button>
      ${p.link ? `<a class="bt leve" href="${esc(p.link)}" target="_blank" rel="noopener">Abrir no Drive</a>` : ''}
      <button class="bt leve" type="button" data-ligar="${esc(p.id)}">Ligar a outro assunto</button>
    </div>
    ${p.apagar === 'sim' ? '<p class="sec" style="margin-top:6px">É só uma sugestão: nada é apagado do Drive por esta página.</p>' : ''}
    ${outros.length ? `<p class="sec" style="margin-top:8px">Também usado em: ${outros.map(x => `<button class="bt texto" type="button" data-assunto="${esc(x)}">${esc(tituloDe(A[x]))}</button>`).join(', ')}</p>` : ''}
    <div class="ligar" data-painel-ligar="${esc(p.id)}" hidden></div>
  </article>`;
}
function cartaoPedido(pe) {

  </article>`;
}

function telaAssunto(id, focoPasta) {
  const a = A[id];
  if (!a) return '<p>Assunto não encontrado.</p><button class="bt" type="button" data-inicio>Voltar ao início</button>';
  const est = estadoAssunto(a), arq = arquivosDe(a.efTotal || a.ef);
  const pessoas = a.tipo === 'tfg' ? '' : lista(a.pessoas).join(', ');
  const meta = [a.anos, a.coord ? 'Coordenação: ' + lista(a.coord).join(', ') : '', a.linhas.map(l => LINHAS[l]).join(', ')].filter(Boolean);
  let raizes = a.raizes.map(x => P[x]).sort((x, y) => y.arquivos - x.arquivos);
  let extra = '';
  if (focoPasta && P[focoPasta]) {
    // pasta procurada: o cartão dela, ou o da pasta de cima que está na lista

    for (let q = P[focoPasta]; q; q = P[q.pai]) if (raizes.includes(q)) { alvo = q; break; }
    if (!alvo) extra = `<h2 class="rotulo">Pasta procurada</h2>${cartaoPasta(P[focoPasta], a, true)}`;
    else if (alvo.id !== focoPasta) extra = `<p class="sec">A pasta ${esc(P[focoPasta].nome)} fica dentro de ${esc(alvo.nome)}, abaixo.</p>`;
    focoPasta = alvo ? alvo.id : focoPasta;
  }
  const verTodas = todos.has('pastas:' + id);
  const visiveis = verTodas ? raizes : raizes.slice(0, MAX);
  const tambem = a.tambemP.map(x => P[x]).filter(p => !raizes.includes(p));
  const caminho = caminhoGalho(a);
  return `<p><button class="bt" type="button" data-inicio>← Voltar ao início</button></p>
    ${caminho.length ? `<p class="caminho-galho">${caminho.map(esc).join(' › ')}</p>` : ''}
    <h2>${esc(tituloDe(a))}</h2>
    ${sobDe(a) ? `<p>${esc(sobDe(a))}</p>` : ''}
    ${meta.length ? `<p class="sec">${meta.map(esc).join(' · ')}</p>` : ''}
    ${pessoas ? `<p class="sec">Pessoas: ${esc(pessoas)}</p>` : ''}
    <p>${arq ? `${plural(arq, 'arquivo', 'arquivos')} em ${plural(raizes.length, 'pasta', 'pastas')}` : 'Nenhum arquivo deste assunto foi achado no Drive do grupo.'}</p>
    ${raizes.length ? `<h2 class="rotulo">Decisão do assunto inteiro</h2>
      <p class="estado"><i class="amostra-cor" style="background:${COR[est.v] || COR.aberto}"></i>${esc(est.texto)}</p>
      <div class="decisao-grande" data-assunto-decisao="${esc(a.id)}">${botoesDecisao(decA[a.id], 'grande')}</div>
      <p class="sec" style="margin-top:8px">Vale para ${raizes.length === 1 ? 'a pasta abaixo' : 'as ' + num(raizes.length) + ' pastas abaixo'}. Você pode mudar uma pasta só.
        ${decA[a.id] ? `<button class="bt texto" type="button" data-limpar-assunto="${esc(a.id)}">Tirar a decisão do assunto</button>` : ''}</p>` : ''}
    ${a.pedidos.length ? `<h2 class="rotulo">O que falta e a quem pedir</h2>${a.pedidos.map(cartaoPedido).join('')}` : ''}
    ${extra}
    ${raizes.length ? `<h2 class="rotulo">Pastas</h2>${visiveis.map(p => cartaoPasta(p, a, p.id === focoPasta)).join('')}
      ${visiveis.length < raizes.length ? `<p><button class="bt texto" type="button" data-todas-pastas="${esc(id)}">Ver todas (${num(raizes.length)})</button></p>` : ''}` : ''}
    ${tambem.length ? `<h2 class="rotulo">Também usado aqui</h2><p class="sec">Pastas de outros assuntos que servem a este.</p>${tambem.slice(0, MAX).map(p => cartaoPasta(p, a)).join('')}` : ''}
    ${a.filhos.length ? `<h2 class="rotulo">Dentro deste</h2>${listaNivel(a, 0)}` : ''}`;
}

function painelLigar(pid) {
  const el = document.querySelector(`[data-painel-ligar="${CSS.escape(pid)}"]`);
  if (!el) return;
  if (!el.hidden) { el.hidden = true; el.innerHTML = ''; return; }
  el.hidden = false;
  el.innerHTML = `<div class="campo"><label for="ligar-${esc(pid)}">A que assunto esta pasta também pertence?</label>
    <input id="ligar-${esc(pid)}" type="search" autocomplete="off" placeholder="Digite parte do nome"></div><div class="resultados"></div>`;
  const inp = el.querySelector('input'), res = el.querySelector('.resultados');
  inp.focus();
  inp.oninput = () => {
    const n = norm(inp.value.trim());
    if (n.length < 2) { res.innerHTML = ''; return; }
    const as = Object.values(A).filter(a => !GALHOS.includes(a.tipo) && !P[pid].own.includes(a.id) &&
      norm([tituloDe(a), a.titulo, a.pessoas, a.anos].join(' ')).includes(n)).slice(0, MAX);
    res.innerHTML = as.map(a => `<button class="bt" type="button" data-vincular="${esc(pid)}" data-com="${esc(a.id)}"><span>${esc(tituloDe(a))}</span><span class="sec">${esc(caminhoGalho(a).slice(-1)[0] || '')}</span></button>`).join('') || '<p class="sec">Nada encontrado.</p>';
  };
}

// ---------- gravar, com retorno e desfazer (R9) ----------
let desfazerAcao = null, timerBarra = null;
function barra(texto, erro, desfazer) {
  const b = document.getElementById('barra');
  document.getElementById('barra-texto').textContent = texto;
  b.classList.toggle('erro', !!erro);
  document.getElementById('desfazer').hidden = !desfazer;
  desfazerAcao = desfazer || null;
  b.style.display = 'flex';
  clearTimeout(timerBarra);
  timerBarra = setTimeout(() => { b.style.display = 'none'; desfazerAcao = null; }, 8000);
}
document.getElementById('desfazer').onclick = () => { const f = desfazerAcao; document.getElementById('barra').style.display = 'none'; if (f) f(); };

// muda na tela na hora; grava no servidor; se falhar, volta
function gravar(campo, alvo, valor, aplicar, voltar, ehDesfazer) {
  aplicar(); render();
  const desfazer = ehDesfazer ? null : () => gravar(campo === 'vinculo' ? 'desfazer_vinculo' : campo, alvo, campo === 'vinculo' ? valor : null, voltar, aplicar, true);
  const ok = () => barra(ehDesfazer ? 'Desfeito.' : 'Salvo.', false, desfazer);
  const falha = () => { voltar(); render(); barra('Não salvou. Tente de novo.', true); };
  if (window.DADOS_TESTE) return ok();
  chamar('POST', { k: chave, alvo, campo, valor: campo === 'desfazer_vinculo' ? valor : (valor == null ? '' : valor) }).then(ok, falha);
}
function gravarValor(campo, alvo, novo, obter, definir) {
  const antes = obter();
  if (antes === novo) return;
  const ida = () => definir(novo), volta = () => definir(antes);
  ida(); render();
  const desfazer = () => { volta(); render(); enviar(antes, true); };
  const enviar = (valor, ehDesfazer) => {
    const ok = () => barra(ehDesfazer ? 'Desfeito.' : 'Salvo.', false, ehDesfazer ? null : desfazer);
    const falha = () => { (ehDesfazer ? ida : volta)(); render(); barra('Não salvou. Tente de novo.', true); };
    if (window.DADOS_TESTE) return ok();
    chamar('POST', { k: chave, alvo, campo, valor }).then(ok, falha);
  };
  enviar(novo, false);
}

// ---------- navegação ----------
function rota() {
  const h = decodeURIComponent(location.hash.slice(1));
  const m = /^assunto\/([a-z0-9-]+)(?:\/pasta\/([A-Za-z0-9_-]+))?$/.exec(h);
  return m ? { tela: 'assunto', id: m[1], pasta: m[2] } : { tela: 'inicio' };
}
let rolagemInicio = 0;
function ir(hash) { if (rota().tela === 'inicio') rolagemInicio = scrollY; location.hash = hash; }
function render() {
  const r = rota(), app = document.getElementById('app'), y = scrollY;
  app.innerHTML = r.tela === 'assunto' ? telaAssunto(r.id, r.pasta) : telaInicio();
  if (r.tela === 'inicio') { if (ultimaBusca) buscar(ultimaBusca); }
  window.scrollTo(0, y);
  ligarEventos();
  tempo();
}
window.addEventListener('hashchange', () => {
  const r = rota();
  render();
  if (r.tela === 'inicio') window.scrollTo(0, rolagemInicio);
  else if (r.pasta) { const c = document.querySelector('.cartao.foco'); c ? c.scrollIntoView({ block: 'center' }) : window.scrollTo(0, 0); }
  else window.scrollTo(0, 0);
});

function ligarEventos() {
  const app = document.getElementById('app');
  const b = document.getElementById('busca');
  if (b) b.oninput = () => buscar(b.value);
  const ll = document.getElementById('lente-linha');
  if (ll) ll.onchange = () => { lente.linha = ll.value; abrirLente(); render(); };
  const lp = document.getElementById('lente-pessoa');
  if (lp) lp.onchange = () => { lente.pessoa = lp.value.trim(); abrirLente(); render(); };
  const limpar = document.getElementById('limpar-lente');
  if (limpar) limpar.onclick = () => { lente = { linha: '', pessoa: '' }; render(); };
}
function abrirLente() {
  if (!lente.linha && !lente.pessoa) return;
  Object.values(A).forEach(a => { if (a.filhos.some(temNaLente)) abertos.add(a.id); });
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('button, a');
  if (!t || t.disabled) return;
  const ds = t.dataset;
  if ('inicio' in ds) return ir('');
  if (ds.abrir) { abertos.has(ds.abrir) ? abertos.delete(ds.abrir) : abertos.add(ds.abrir); return render(); }
  if (ds.todos) { todos.add(ds.todos); return render(); }
  if (ds.todasPastas) { todos.add('pastas:' + ds.todasPastas); return render(); }
  if (ds.falta) { filtroFalta = filtroFalta === ds.falta ? '' : ds.falta; return render(); }
  if (ds.pasta && !ds.estado) {
    const p = P[ds.pasta], as = p && ([...p.ef][0] || (A['aberto-a-identificar'] ? 'aberto-a-identificar' : ''));
    return as && ir('assunto/' + as + '/pasta/' + p.id);
  }
  if (ds.assunto && t.classList.contains('bt') || ds.assunto && t.classList.contains('corpo')) return ir('assunto/' + ds.assunto);
  if (ds.v) {
    const caixaA = t.closest('[data-assunto-decisao]'), caixaP = t.closest('[data-pasta-decisao]');
    if (caixaA) { const id = caixaA.dataset.assuntoDecisao;
      return gravarValor('decisao_assunto', id, ds.v, () => decA[id] || '', v => { if (v) decA[id] = v; else delete decA[id]; }); }
    if (caixaP) { const p = P[caixaP.dataset.pastaDecisao];
      return gravarValor('decisao', p.id, ds.v, () => p.decisao, v => p.decisao = v); }
  }
  if (ds.limparAssunto) { const id = ds.limparAssunto; return gravarValor('decisao_assunto', id, '', () => decA[id] || '', v => { if (v) decA[id] = v; else delete decA[id]; }); }
  if (ds.limparPasta) { const p = P[ds.limparPasta]; return gravarValor('decisao', p.id, '', () => p.decisao, v => p.decisao = v); }
  if (ds.apagar) { const p = P[ds.apagar]; return gravarValor('apagar', p.id, p.apagar === 'sim' ? '' : 'sim', () => p.apagar, v => p.apagar = v); }
  if (ds.pedido) { const pe = pedidos.find(x => x.id === ds.pedido); return gravarValor('estado_pedido', pe.id, ds.estado, () => pe.estado, v => pe.estado = v); }
  if (ds.ligar) return painelLigar(ds.ligar);
  if (ds.vincular) {
    const pid = ds.vincular, as = ds.com;
    return gravar('vinculo', pid, as, () => aplicarVinculo(pid, as, 'material'), () => tirarVinculo(pid, as));
  }
});

// ---------- carregamento (R10) ----------
const T0 = performance.now();
let etapa = 'abrindo a página';
const relogio = setInterval(() => {
  const s = Math.round((performance.now() - T0) / 1000);
  document.getElementById('etapa').textContent = 'Carregando o acervo: ' + etapa + ' (' + s + ' s)' +
    (s >= 25 ? '. Está demorando mais que o normal; se passar de 60 s, recarregue a página.' : '');
}, 1000);
function tempo() {
  const el = document.getElementById('tempo');
  if (el && window.CARREGOU) el.textContent = 'Carregou em ' + window.CARREGOU + ' s.';
}
function erroInicial(e) {
  clearInterval(relogio);
  const m = String(e && e.message || e);
  document.getElementById('etapa').textContent = m.includes('SEM_CHAVE')
    ? 'Este link não abre o visualizador. Use o link pessoal que o grupo enviou para você, ou peça um novo a Arthur.'
    : m.includes('SEM_ACESSO') ? 'A página não conseguiu abrir a planilha do Catálogo. Avise Arthur.'
    : 'Não foi possível carregar: ' + m;
}
function iniciar(d) {
  etapa = 'montando a árvore';
  montar(d);
  clearInterval(relogio);
  window.CARREGOU = ((performance.now() - T0) / 1000).toFixed(1).replace('.', ',');
  document.getElementById('carregando').hidden = true;
  document.getElementById('app').hidden = false;
  render();
}
if (window.DADOS_TESTE) iniciar(window.DADOS_TESTE);
else { etapa = 'lendo a planilha do Catálogo'; chamar('GET', { acao: 'dados', k: chave }).then(iniciar).catch(erroInicial); }
</script>
